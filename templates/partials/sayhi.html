<section class="sayhi wrap" id="say-hi" aria-labelledby="sayhi-k">
  <p class="tag" id="sayhi-k"><span class="type" data-type>{{kicker}}</span></p>
  <div class="sayhi__mail">
    <a class="row sayhi__link big" href="mailto:{{email}}" aria-label="{{email}}">{{email_roll}}</a>
    <svg class="sayhi__star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.6c.8 5.2 3.6 8.4 9.2 9.3c-5.4 1.1-8.3 4-9.3 9.5c-.9-5.4-3.8-8.3-9.4-9.3c5.5-1 8.5-4 9.5-9.5Z"/></svg>
    <button class="btag tag" type="button" data-copy="{{email}}">[Copy]</button>
  </div>
  <div class="pills tag">{{pills}}</div>
</section>
