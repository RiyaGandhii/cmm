<aside class="panel" id="about-panel" role="dialog" aria-modal="true" aria-label="{{about_me}}" tabindex="-1">
  <div class="panel__top"><span class="hdr__name">{{wordmark}}</span><button class="close" type="button" data-close>{{close}}</button></div>
  <p class="lead">{{bio}}</p>
  <p class="tag"><a class="btag" href="about.html">[{{read}}]</a></p>
  <div class="marquee big outline"><div class="marquee__track"><span>{{employers}}</span><span aria-hidden="true">{{employers}}</span></div></div>
</aside>
